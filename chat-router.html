<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat AET | 6-Model Integrated AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.sub{font-size:11px;color:#697386;margin-top:3px}.messages{flex:1;padding:24px 18px;overflow:auto}.msg{max-width:80%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-left:auto;background:#111827;color:#fff}.ai{background:#fff;border:1px solid #e2e6ee}.ai .markdown h1,.ai .markdown h2,.ai .markdown h3{margin:12px 0 7px;line-height:1.35}.ai .markdown h1{font-size:1.25rem}.ai .markdown h2{font-size:1.15rem}.ai .markdown h3{font-size:1.05rem}.ai .markdown p{margin:7px 0}.ai .markdown strong{font-weight:800}.ai .markdown ul,.ai .markdown ol{margin:7px 0;padding-left:24px}.ai .markdown li{margin:3px 0}.ai .markdown code{background:#eef1f6;border-radius:5px;padding:2px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}.ai .markdown pre{background:#f1f3f7;border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre-wrap}.ai .markdown pre code{background:transparent;padding:0}.ai .markdown blockquote{border-left:3px solid #cbd2dd;margin:8px 0;padding-left:10px;color:#4b5563}.math{white-space:normal}.math-block{display:block;text-align:center;margin:10px 0;overflow-x:auto;overflow-y:hidden}.empty{text-align:center;color:#697386;margin-top:22vh}.composer{padding:14px;background:#fff;border-top:1px solid #e4e8ef;display:flex;gap:10px;position:sticky;bottom:0}.composer textarea{flex:1;resize:none;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;min-height:48px}.composer button{height:48px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:700;padding:0 18px}.composer button:disabled{opacity:.5}.attach{font-size:22px!important;padding:0 14px!important;background:#e8edf5!important;color:#111827!important}.preview{display:none;padding:10px 14px;background:#fff;border-top:1px solid #e4e8ef;align-items:center;gap:10px}.preview.show{display:flex}.preview img{width:56px;height:56px;object-fit:cover;border-radius:10px}.preview span{flex:1;font-size:12px;color:#697386}.remove{padding:0!important;width:32px!important;height:32px!important;background:#eef1f6!important;color:#111827!important}.user-image{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-top:8px}.cursor{display:inline-block;width:7px;height:1em;vertical-align:-.15em;background:#697386;margin-left:3px;animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
</style>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body><main class="app">
<header class="top"><div><div class="title">🤖 Chat AET</div><div id="status" class="sub">🧠 6モデル統合 · ゲストモード</div></div><a href="./" style="color:#697386;text-decoration:none;font-size:13px">ホーム</a></header>
<section id="messages" class="messages"><div id="empty" class="empty">こんにちは！Chat AETです。<br>Qwen・GPT-OSS・DeepSeek・Llama・Mistral・Geminiの強みを統合して回答します。</div></section>
<div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="removeImage" class="remove" type="button">×</button></div>
<form id="form" class="composer"><input id="file" type="file" accept="image/*" hidden><button id="attach" class="attach" type="button">🖼️</button><textarea id="input" placeholder="メッセージを入力…" rows="1"></textarea><button id="send" type="submit">送信</button></form>
</main>
<script src="./memory-system.js"></script><script>
const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-router';const messagesEl=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),fileInput=document.getElementById('file'),attach=document.getElementById('attach'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),previewName=document.getElementById('previewName'),removeImage=document.getElementById('removeImage'),status=document.getElementById('status');const history=[];let selectedImage=null;
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function renderMarkdown(source){let s=escapeHtml(source).replace(/\r\n?/g,'\n');const blocks=[];s=s.replace(/```([\s\S]*?)```/g,(_,code)=>{const id=blocks.push(`<pre><code>${code.trim()}</code></pre>`)-1;return `@@CODE${id}@@`;});s=s.replace(/\$\$([\s\S]*?)\$\$/g,(_,math)=>{const id=blocks.push(`<div class="math-block">\\[${math.trim()}\\]</div>`)-1;return `@@MATH${id}@@`;});s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>');s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');s=s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');s=s.replace(/(^|\n)([-*] .+(?:\n[-*] .+)*)/g,(_,prefix,list)=>prefix+'<ul>'+list.split('\n').map(x=>'<li>'+x.slice(2)+'</li>').join('')+'</ul>');s=s.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');s='<div class="markdown"><p>'+s+'</p></div>';s=s.replace(/<p>(<(?:h1|h2|h3|pre|div class="math-block"|ul|blockquote)[\s\S]*?)<\/p>/g,'$1');s=s.replace(/@@CODE(\d+)@@/g,(_,i)=>blocks[Number(i)]).replace(/@@MATH(\d+)@@/g,(_,i)=>blocks[Number(i)]);return s;}
function add(role,text,img){document.getElementById('empty')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');if(text){const t=document.createElement('div');if(role==='assistant'){t.innerHTML=renderMarkdown(text)}else{t.textContent=text}d.appendChild(t)}if(img){const i=document.createElement('img');i.className='user-image';i.src=img;d.appendChild(i)}messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight;if(role==='assistant'&&window.MathJax?.typesetPromise)window.MathJax.typesetPromise([d]).catch(()=>{});return d;}
function updateAnswer(target,answer){target.innerHTML=renderMarkdown(answer);if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([target]).catch(()=>{});messagesEl.scrollTop=messagesEl.scrollHeight;}
function clearImage(){selectedImage=null;fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return reject(new Error('画像変換失敗'));const x=new FileReader();x.onload=()=>resolve({mimeType:'image/jpeg',data:String(x.result).split(',')[1],preview:String(x.result),name:file.name});x.readAsDataURL(b)},'image/jpeg',.82)};img.onerror=()=>reject(new Error('画像を読み込めません'));img.src=String(r.result)};r.readAsDataURL(file)})}
async function readStream(response,target){if(!response.body)throw new Error('ストリーミング非対応の応答です');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',answer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const raw of lines){const line=raw.trim();if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]')continue;let obj;try{obj=JSON.parse(payload)}catch{continue}if(obj.error)throw new Error(obj.error);const delta=obj.delta??obj.answer??obj.choices?.[0]?.delta?.content??obj.choices?.[0]?.text??'';if(delta){answer+=delta;updateAnswer(target,answer)}}}return answer}
attach.onclick=()=>fileInput.click();fileInput.onchange=async()=>{const f=fileInput.files?.[0];if(!f)return;try{selectedImage=await resizeImage(f);previewImg.src=selectedImage.preview;previewName.textContent=f.name;preview.classList.add('show')}catch(e){add('assistant','エラー: '+e.message);clearImage()}};removeImage.onclick=clearImage;
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if((!message&&!selectedImage)||send.disabled)return;const image=selectedImage;status.textContent='🧠 6モデルが連携中…';add('user',message||'この画像を見てください。',image?.preview);input.value='';clearImage();send.disabled=attach.disabled=true;const w=add('assistant','');w.innerHTML='<span class="cursor"></span>';try{const body={message,history,memory:typeof ChatAETMemory!=='undefined'?ChatAETMemory.context(message):''};if(image)body.image={mimeType:image.mimeType,data:image.data};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let msg='AIへの接続に失敗しました';try{const x=await r.json();msg=x.error||msg}catch{}throw new Error(msg)}w.innerHTML='';const answer=await readStream(r,w);if(!answer)throw new Error('AIから回答がありませんでした');history.push({role:'user',content:message||'[画像]'},{role:'assistant',content:answer});if(typeof ChatAETMemory!=='undefined'){const remembered=ChatAETMemory.remember(message);if(remembered&&remembered.level==='task'&&/(完了|完成|できた|出来た|追加済み|実装済み|終了|終わった)/.test(answer))ChatAETMemory.remember(`${remembered.major} ${remembered.middle} 完了`)}}catch(err){w.textContent='エラー: '+err.message}finally{status.textContent='🧠 6モデル統合 · ゲストモード';send.disabled=attach.disabled=false;input.focus()}};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}};
</script></body></html>

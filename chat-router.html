<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | AI Router</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.sub{font-size:11px;color:#697386;margin-top:3px}.messages{flex:1;padding:24px 18px;overflow:auto}.msg{max-width:80%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#111827;color:#fff}.ai{background:#fff;border:1px solid #e2e6ee}.empty{text-align:center;color:#697386;margin-top:22vh}.composer{padding:14px;background:#fff;border-top:1px solid #e4e8ef;display:flex;gap:10px;position:sticky;bottom:0}.composer textarea{flex:1;resize:none;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;min-height:48px}.composer button{height:48px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:700;padding:0 18px}.composer button:disabled{opacity:.5}.attach{font-size:22px!important;padding:0 14px!important;background:#e8edf5!important;color:#111827!important}.preview{display:none;padding:10px 14px;background:#fff;border-top:1px solid #e4e8ef;align-items:center;gap:10px}.preview.show{display:flex}.preview img{width:56px;height:56px;object-fit:cover;border-radius:10px}.preview span{flex:1;font-size:12px;color:#697386}.remove{padding:0!important;width:32px!important;height:32px!important;background:#eef1f6!important;color:#111827!important}.user-image{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-top:8px}</style></head><body><main class="app"><header class="top"><div><div class="title">🤖 Chat AET</div><div id="status" class="sub">🧠 4モデルAIルーター · ゲストモード</div></div><a href="./" style="color:#697386;text-decoration:none;font-size:13px">ホーム</a></header><section id="messages" class="messages"><div id="empty" class="empty">こんにちは！Chat AETです。<br>Qwen・GPT-OSS・DeepSeek・Llamaを用途に応じて選択します。</div></section><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="removeImage" class="remove" type="button">×</button></div><form id="form" class="composer"><input id="file" type="file" accept="image/*" hidden><button id="attach" class="attach" type="button">🖼️</button><textarea id="input" placeholder="メッセージを入力…" rows="1"></textarea><button id="send" type="submit">送信</button></form></main><script src="./memory-system.js"></script><script>
const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-router';const messagesEl=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),fileInput=document.getElementById('file'),attach=document.getElementById('attach'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),previewName=document.getElementById('previewName'),removeImage=document.getElementById('removeImage'),status=document.getElementById('status');const history=[];let selectedImage=null;
function choose(m){if(/(github|コード|プログラム|実装|バグ|エラー|開発|html|css|javascript|typescript|sql|supabase|api|関数)/i.test(m))return'GPT-OSS';if(/(数学|計算|方程式|証明|論理|推論|パズル)/i.test(m))return'DeepSeek';if(/(日本語|翻訳|文章|会話|説明|要約|作文|雑談)/i.test(m))return'Qwen';return'Llama'}
function add(role,text,img){document.getElementById('empty')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');if(text){const t=document.createElement('div');t.textContent=text;d.appendChild(t)}if(img){const i=document.createElement('img');i.className='user-image';i.src=img;d.appendChild(i)}messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight}
function clearImage(){selectedImage=null;fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return reject(new Error('画像変換失敗'));const x=new FileReader();x.onload=()=>resolve({mimeType:'image/jpeg',data:String(x.result).split(',')[1],preview:String(x.result),name:file.name});x.readAsDataURL(b)},'image/jpeg',.82)};img.onerror=()=>reject(new Error('画像を読み込めません'));img.src=String(r.result)};r.readAsDataURL(file)})}
attach.onclick=()=>fileInput.click();fileInput.onchange=async()=>{const f=fileInput.files?.[0];if(!f)return;try{selectedImage=await resizeImage(f);previewImg.src=selectedImage.preview;previewName.textContent=f.name;preview.classList.add('show')}catch(e){add('assistant','エラー: '+e.message);clearImage()}};removeImage.onclick=clearImage;
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if((!message&&!selectedImage)||send.disabled)return;const image=selectedImage;const model=choose(message);status.textContent=`🧠 ${model}を選択 · 4モデルAIルーター`;add('user',message||'この画像を見てください。',image?.preview);input.value='';clearImage();send.disabled=attach.disabled=true;const w=document.createElement('div');w.className='msg ai';w.textContent=`${model}を選択して考え中…`;messagesEl.appendChild(w);try{const body={message,history,memory:ChatAETMemory.context(message),model:model.toLowerCase().replace('gpt-oss','gpt-oss').replace('deepseek','deepseek').replace('qwen','qwen').replace('llama','llama')};if(image)body.image={mimeType:image.mimeType,data:image.data};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();w.remove();if(!r.ok)throw new Error(data.error||'AIへの接続に失敗しました');add('assistant',data.answer);history.push({role:'user',content:message||'[画像]'},{role:'assistant',content:data.answer});const remembered=ChatAETMemory.remember(message);if(remembered&&remembered.level==='task'&&/(完了|完成|できた|出来た|追加済み|実装済み|終了|終わった)/.test(data.answer))ChatAETMemory.remember(`${remembered.major} ${remembered.middle} 完了`)}catch(err){w.remove();add('assistant','エラー: '+err.message)}finally{send.disabled=attach.disabled=false;input.focus()}};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}};
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | AIチャット</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.guest{font-size:12px;color:#697386}.memory{font-size:11px;color:#697386;margin-top:3px}.messages{flex:1;padding:24px 18px;overflow:auto}.msg{max-width:78%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#111827;color:#fff}.ai{background:#fff;border:1px solid #e2e6ee}.empty{text-align:center;color:#697386;margin-top:22vh}.composer{padding:14px;background:#fff;border-top:1px solid #e4e8ef;display:flex;gap:10px;position:sticky;bottom:0;align-items:flex-end}.composer textarea{flex:1;min-width:0;resize:none;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;min-height:48px;max-height:140px}.composer button{flex:0 0 82px;width:82px;height:48px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:700}.composer button:disabled{opacity:.5}.attach{flex:0 0 52px!important;width:52px!important;height:48px!important;font-size:23px!important;padding:0!important;display:grid!important;place-items:center!important;background:#e8edf5!important;color:#111827!important;border:1px solid #cfd7e4!important}.back{color:#697386;text-decoration:none;font-size:13px}.preview{display:none;padding:10px 14px;background:#fff;border-top:1px solid #e4e8ef;align-items:center;gap:10px}.preview.show{display:flex}.preview img{width:64px;height:64px;object-fit:cover;border-radius:10px}.preview span{font-size:13px;color:#697386;flex:1}.remove{flex:0 0 32px!important;width:32px!important;height:32px!important;background:#eef1f6!important;color:#111827!important}.user-image{display:block;max-width:220px;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px}.msg .meta{font-size:12px;opacity:.7;margin-top:6px}</style></head><body><main class="app"><header class="top"><div><div class="title">🤖 Chat AET</div><div class="guest">ゲストモード・チャットは保存されません</div><div id="memoryStatus" class="memory">🧠 軽量記憶：準備中</div></div><a class="back" href="./">ホーム</a></header><section id="messages" class="messages"><div id="empty" class="empty">こんにちは！Chat AETです。<br>何でも話しかけてください。</div></section><div id="preview" class="preview"><img id="previewImg" alt="選択した画像"><span id="previewName"></span><button id="removeImage" class="remove" type="button">×</button></div><form id="form" class="composer"><input id="file" type="file" accept="image/*" hidden><button id="attach" class="attach" type="button" title="画像を追加" aria-label="画像を追加">🖼️</button><textarea id="input" placeholder="メッセージを入力…" rows="1"></textarea><button id="send" type="submit">送信</button></form></main><script src="./memory-system.js"></script><script>const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-gemini';const messagesEl=document.getElementById('messages');const input=document.getElementById('input');const send=document.getElementById('send');const fileInput=document.getElementById('file');const attach=document.getElementById('attach');const preview=document.getElementById('preview');const previewImg=document.getElementById('previewImg');const previewName=document.getElementById('previewName');const removeImage=document.getElementById('removeImage');const memoryStatus=document.getElementById('memoryStatus');const history=[];let selectedImage=null;function updateMemoryStatus(){const n=ChatAETMemory.load().length;memoryStatus.textContent=`🧠 軽量記憶：${n}件`; }updateMemoryStatus();function add(role,text,imageData=null){document.getElementById('empty')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');if(text){const t=document.createElement('div');t.textContent=text;d.appendChild(t)}if(imageData){const img=document.createElement('img');img.className='user-image';img.src=imageData;img.alt='送信した画像';d.appendChild(img)}messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight}function clearImage(){selectedImage=null;fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''}function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1600;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob)return reject(new Error('画像の変換に失敗しました'));const r=new FileReader();r.onload=()=>resolve({mimeType:'image/jpeg',data:String(r.result).split(',')[1],preview:String(r.result),name:file.name});r.onerror=()=>reject(new Error('画像の読み込みに失敗しました'));r.readAsDataURL(blob)},'image/jpeg',.82)};img.onerror=()=>reject(new Error('画像を読み込めませんでした'));img.src=String(reader.result)};reader.onerror=()=>reject(new Error('画像の読み込みに失敗しました'));reader.readAsDataURL(file)})}attach.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){add('assistant','エラー: 画像ファイルを選択してください。');clearImage();return}try{selectedImage=await resizeImage(file);previewImg.src=selectedImage.preview;previewName.textContent=selectedImage.name;preview.classList.add('show')}catch(err){clearImage();add('assistant','エラー: '+err.message)}});removeImage.addEventListener('click',clearImage);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if((!message&&!selectedImage)||send.disabled)return;const image=selectedImage;add('user',message||'この画像を見てください。',image?.preview||null);input.value='';clearImage();send.disabled=true;attach.disabled=true;const waiting=document.createElement('div');waiting.className='msg ai';waiting.textContent='考え中…';messagesEl.appendChild(waiting);try{const relatedMemory=ChatAETMemory.context(message);const body={message,history,memory:relatedMemory};if(image)body.image={mimeType:image.mimeType,data:image.data};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();waiting.remove();if(!r.ok)throw new Error(data.error||'AIへの接続に失敗しました');add('assistant',data.answer);history.push({role:'user',content:message||'[画像]'});history.push({role:'assistant',content:data.answer});const remembered=ChatAETMemory.remember(message);if(remembered&&remembered.level==='task'&&/(完了|完成|できた|出来た|追加済み|実装済み|終了|終わった)/.test(data.answer)){ChatAETMemory.remember(`${remembered.major} ${remembered.middle} 完了`);}updateMemoryStatus();}catch(err){waiting.remove();add('assistant','エラー: '+err.message);}finally{send.disabled=false;attach.disabled=false;input.focus();}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});</script></body></html>

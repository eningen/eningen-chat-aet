<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | AIチャット</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:14px 18px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:800}.status{font-size:12px;color:#697386;margin-top:3px}.actions{display:flex;gap:8px;align-items:center}.back,.logout{color:#697386;text-decoration:none;font-size:13px;border:0;background:none;cursor:pointer}.logout{padding:7px 9px}.messages{flex:1;padding:24px 18px;overflow:auto}.msg{max-width:78%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#111827;color:#fff}.ai{background:#fff;border:1px solid #e2e6ee}.empty{text-align:center;color:#697386;margin-top:22vh}.composer{padding:14px;background:#fff;border-top:1px solid #e4e8ef;display:flex;gap:10px;position:sticky;bottom:0;align-items:flex-end}.composer textarea{flex:1;resize:none;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;min-height:48px;max-height:140px}.composer button{width:82px;height:48px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:700}.composer button:disabled{opacity:.5}.attach{width:48px!important;font-size:22px;padding:0}.preview{display:none;padding:10px 14px;background:#fff;border-top:1px solid #e4e8ef;align-items:center;gap:10px}.preview.show{display:flex}.preview img{width:64px;height:64px;object-fit:cover;border-radius:10px}.preview span{font-size:13px;color:#697386;flex:1}.remove{width:32px!important;height:32px!important;background:#eef1f6!important;color:#111827!important}.user-image{display:block;max-width:220px;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px}.login{max-width:520px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #e2e6ee;border-radius:20px;text-align:center}.login a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:#111827;color:#fff;text-decoration:none;font-weight:700}.memory{font-size:11px;color:#8b94a4;margin-left:6px}</style></head><body><main class="app"><header class="top"><div><div class="title">🤖 Chat AET <span id="memory" class="memory"></span></div><div id="status" class="status">認証を確認しています…</div></div><div class="actions"><a class="back" href="./">ホーム</a><button id="logout" class="logout" type="button">ログアウト</button></div></header><section id="messages" class="messages"><div id="empty" class="empty">こんにちは！Chat AETです。<br>何でも話しかけてください。</div></section><div id="preview" class="preview"><img id="previewImg" alt="選択した画像"><span id="previewName"></span><button id="removeImage" class="remove" type="button">×</button></div><form id="form" class="composer"><input id="file" type="file" accept="image/*" hidden><button id="attach" class="attach" type="button" title="画像を追加">＋</button><textarea id="input" placeholder="メッセージを入力…" rows="1"></textarea><button id="send" type="submit">送信</button></form></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://zvcssqtcshljucbbkoac.supabase.co','sb_publishable__cgPjoZaQ5Np8EMrd_Fi1Q_6C6zzNcF');const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-gemini-v2';const messagesEl=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),fileInput=document.getElementById('file'),attach=document.getElementById('attach'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),previewName=document.getElementById('previewName'),removeImage=document.getElementById('removeImage'),status=document.getElementById('status'),memory=document.getElementById('memory'),logout=document.getElementById('logout'),form=document.getElementById('form');const history=[];let selectedImage=null,session=null;function add(role,text,imageData=null){document.getElementById('empty')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');if(text){const t=document.createElement('div');t.textContent=text;d.appendChild(t)}if(imageData){const img=document.createElement('img');img.className='user-image';img.src=imageData;img.alt='送信した画像';d.appendChild(img)}messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight;return d}function clearImage(){selectedImage=null;fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''}function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob)return reject(new Error('画像の変換に失敗しました'));const r=new FileReader();r.onload=()=>resolve({mimeType:'image/jpeg',data:String(r.result).split(',')[1],preview:String(r.result),name:file.name});r.onerror=()=>reject(new Error('画像の読み込みに失敗しました'));r.readAsDataURL(blob)},'image/jpeg',.82)};img.onerror=()=>reject(new Error('画像を読み込めませんでした'));img.src=String(reader.result)};reader.onerror=()=>reject(new Error('画像の読み込みに失敗しました'));reader.readAsDataURL(file)})}async function init(){const{data}=await supabase.auth.getSession();session=data.session;if(!session){location.href='./auth.html';return}status.textContent=`ログイン中: ${session.user.email}`;memory.textContent='🧠 長期記憶ON';logout.onclick=async()=>{await supabase.auth.signOut();location.href='./auth.html'};supabase.auth.onAuthStateChange((_e,s)=>{session=s;if(!s)location.href='./auth.html'});try{const{count}=await supabase.from('aet_memories').select('*',{count:'exact',head:true});if(typeof count==='number')memory.textContent=`🧠 長期記憶 ${count}件`}catch{}}attach.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){add('assistant','エラー: 画像ファイルを選択してください。');clearImage();return}try{selectedImage=await resizeImage(file);previewImg.src=selectedImage.preview;previewName.textContent=selectedImage.name;preview.classList.add('show')}catch(err){clearImage();add('assistant','エラー: '+err.message)}});removeImage.addEventListener('click',clearImage);form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if((!message&&!selectedImage)||send.disabled)return;if(!session){add('assistant','ログインが必要です。');return}const image=selectedImage;add('user',message||'この画像を見てください。',image?.preview||null);input.value='';clearImage();send.disabled=true;attach.disabled=true;const waiting=add('assistant','考え中…');try{const{data}=await supabase.auth.getSession();session=data.session;if(!session)throw new Error('ログインセッションが切れました。');const body={message,history};if(image)body.image={mimeType:image.mimeType,data:image.data};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify(body)});const result=await r.json();waiting.remove();if(!r.ok)throw new Error(result.error||'AIへの接続に失敗しました');add('assistant',result.answer);history.push({role:'user',content:message||'[画像]'});history.push({role:'assistant',content:result.answer});if(typeof result.memoryUsed==='number'||typeof result.learningUsed==='number'){memory.textContent=`🧠 長期記憶 ${Number(result.memoryUsed||0)}件・学習 ${Number(result.learningUsed||0)}件`}}catch(err){waiting.remove();add('assistant','エラー: '+err.message)}finally{send.disabled=false;attach.disabled=false;input.focus()}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});init();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | AIチャット</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.guest{font-size:12px;color:#697386}.messages{flex:1;padding:24px 18px;overflow:auto}.msg{max-width:78%;padding:13px 15px;border-radius:16px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#111827;color:#fff}.ai{background:#fff;border:1px solid #e2e6ee}.empty{text-align:center;color:#697386;margin-top:22vh}.composer{padding:14px;background:#fff;border-top:1px solid #e4e8ef;display:flex;gap:10px;position:sticky;bottom:0}.composer textarea{flex:1;resize:none;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;min-height:48px;max-height:140px}.composer button{width:82px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:700}.composer button:disabled{opacity:.5}.back{color:#697386;text-decoration:none;font-size:13px}</style></head><body><main class="app"><header class="top"><div><div class="title">🤖 Chat AET</div><div class="guest">ゲストモード・チャットは保存されません</div></div><a class="back" href="./">ホーム</a></header><section id="messages" class="messages"><div id="empty" class="empty">こんにちは！Chat AETです。<br>何でも話しかけてください。</div></section><form id="form" class="composer"><textarea id="input" placeholder="メッセージを入力…" rows="1"></textarea><button id="send" type="submit">送信</button></form></main><script>const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet';const messagesEl=document.getElementById('messages');const input=document.getElementById('input');const send=document.getElementById('send');const history=[];function add(role,text){document.getElementById('empty')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');d.textContent=text;messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;add('user',message);input.value='';send.disabled=true;const waiting=document.createElement('div');waiting.className='msg ai';waiting.textContent='考え中…';messagesEl.appendChild(waiting);try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});const data=await r.json();waiting.remove();if(!r.ok)throw new Error(data.error||'AIへの接続に失敗しました');add('assistant',data.answer);history.push({role:'user',content:message},{role:'assistant',content:data.answer});}catch(err){waiting.remove();add('assistant','エラー: '+err.message);}finally{send.disabled=false;input.focus();}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});</script></body></html>

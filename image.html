<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | AI画像生成</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.sub{font-size:11px;color:#697386;margin-top:3px}.messages{flex:1;padding:24px 18px;overflow:auto}.card{background:#fff;border:1px solid #e2e6ee;border-radius:18px;padding:16px;margin:12px 0}.prompt{width:100%;min-height:120px;resize:vertical;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.select{height:44px;border:1px solid #d9dee8;border-radius:12px;background:#fff;padding:0 10px;font:inherit}.button{height:46px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:700;padding:0 16px;cursor:pointer}.button:disabled{opacity:.5}.secondary{background:#e8edf5;color:#111827}.preview{display:none;gap:10px;align-items:center;margin-top:12px}.preview.show{display:flex}.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px}.note{font-size:12px;color:#697386;line-height:1.6}.error{color:#b42318;background:#fff1f0;border:1px solid #ffd5d2;border-radius:12px;padding:10px;margin-top:10px;display:none}.error.show{display:block}.generated{display:none;width:100%;max-width:760px;border-radius:16px;margin-top:14px;border:1px solid #e2e6ee}.generated.show{display:block}.download{display:none;margin-top:10px;text-align:center;text-decoration:none}.download.show{display:block}.back{color:#697386;text-decoration:none;font-size:13px}</style></head><body><main class="app"><header class="top"><div><div class="title">🎨 Chat AET 画像生成</div><div id="status" class="sub">AET Image Model 0.3 · 外部AIなし</div></div><a class="back" href="./">ホーム</a></header><section class="messages"><div class="card"><h2 style="margin-top:0">どんな画像を作る？</h2><textarea id="prompt" class="prompt" placeholder="例：夕暮れの大阪の街を走る、未来的な青い棒人間ロボット"></textarea><div class="row"><select id="ratio" class="select"><option value="1:1">1:1 正方形</option><option value="16:9">16:9 横長</option><option value="9:16">9:16 縦長</option><option value="4:3">4:3</option><option value="3:4">3:4</option></select><button id="generate" class="button" type="button">✨ 画像を生成</button></div><div id="error" class="error"></div><p class="note">Chat AET自身のAET Image Modelで生成します。Geminiなどの外部AIモデルには切り替えません。</p></div><div class="card"><div id="empty" class="note">ここに生成画像が表示されます。</div><img id="generated" class="generated" alt="Chat AETが生成した画像"><a id="download" class="button download" download="chat-aet-generated.svg">⬇️ 画像を保存</a></div></section></main><script>const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-image',promptEl=document.getElementById('prompt'),ratio=document.getElementById('ratio'),generate=document.getElementById('generate'),generated=document.getElementById('generated'),download=document.getElementById('download'),error=document.getElementById('error'),status=document.getElementById('status'),empty=document.getElementById('empty');function showError(msg){error.textContent=msg;error.classList.add('show')}function hideError(){error.classList.remove('show');error.textContent=''}generate.onclick=async()=>{hideError();const prompt=promptEl.value.trim();if(!prompt){showError('画像の内容を入力してください');return}generate.disabled=true;status.textContent='🎨 AET Image Modelが生成中…';empty.style.display='none';generated.classList.remove('show');download.classList.remove('show');try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,aspectRatio:ratio.value})});let x=null;try{x=await r.json()}catch{}if(!r.ok||!x?.image)throw new Error(x?.error||x?.answer||'画像生成に失敗しました');generated.src=x.image;generated.classList.add('show');download.href=x.image;download.classList.add('show');status.textContent='✅ AET Image Modelで生成完了'}catch(e){showError(e?.message||'画像生成に失敗しました');status.textContent='⚠️ 画像生成に失敗しました'}finally{generate.disabled=false}};</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat AET | AI画像生成</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:800px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid #e4e8ef;background:#fff;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.sub{font-size:11px;color:#697386;margin-top:3px}.messages{flex:1;padding:24px 18px;overflow:auto}.card{background:#fff;border:1px solid #e2e6ee;border-radius:18px;padding:16px;margin:12px 0}.prompt{width:100%;min-height:120px;resize:vertical;border:1px solid #d9dee8;border-radius:14px;padding:12px;font:inherit;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.select{height:44px;border:1px solid #d9dee8;border-radius:12px;background:#fff;padding:0 10px;font:inherit}.button{height:46px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:700;padding:0 16px;cursor:pointer}.button:disabled{opacity:.5}.secondary{background:#e8edf5;color:#111827}.preview{display:none;gap:10px;align-items:center;margin-top:12px}.preview.show{display:flex}.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px}.generated{display:none;width:100%;max-width:760px;border-radius:16px;margin-top:14px;border:1px solid #e2e6ee}.generated.show{display:block}.note{font-size:12px;color:#697386;line-height:1.6}.error{color:#b42318;background:#fff1f0;border:1px solid #ffd5d2;border-radius:12px;padding:10px;margin-top:10px;display:none}.error.show{display:block}.download{display:none;margin-top:10px;text-align:center;text-decoration:none}.download.show{display:block}.back{color:#697386;text-decoration:none;font-size:13px}
</style>
</head>
<body><main class="app">
<header class="top"><div><div class="title">🎨 Chat AET 画像生成</div><div id="status" class="sub">Nano Banana 2 · Gemini 3.1 Flash Image</div></div><a class="back" href="./">ホーム</a></header>
<section class="messages">
<div class="card">
<h2 style="margin-top:0">どんな画像を作る？</h2>
<textarea id="prompt" class="prompt" placeholder="例：夕暮れの大阪の街を走る、未来的な青い棒人間ロボット。映画のワンシーンのような高品質な3D表現。"></textarea>
<div class="row">
<select id="ratio" class="select"><option value="1:1">1:1 正方形</option><option value="16:9">16:9 横長</option><option value="9:16">9:16 縦長</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">21:9 超横長</option></select>
<select id="size" class="select"><option value="1K">1K 高速</option><option value="2K">2K 高品質</option><option value="4K">4K 最高品質</option></select>
<input id="file" type="file" accept="image/*" hidden><button id="attach" class="button secondary" type="button">🖼️ 参考画像</button><button id="generate" class="button" type="button">✨ 画像を生成</button>
</div>
<div id="preview" class="preview"><img id="previewImg"><span id="previewName" class="note"></span><button id="clear" class="button secondary" type="button">×</button></div>
<p class="note">参考画像を付けると、画像の内容をもとに編集・変換もできます。生成画像にはGoogleのSynthIDウォーターマークが含まれます。</p>
<div id="error" class="error"></div>
</div>
<div class="card"><div id="empty" class="note">ここに生成画像が表示されます。</div><img id="generated" class="generated"><a id="download" class="button download" download="chat-aet-generated.png">⬇️ 画像を保存</a></div>
</section>
</main>
<script>
const endpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-image';
const promptEl=document.getElementById('prompt'),ratio=document.getElementById('ratio'),size=document.getElementById('size'),file=document.getElementById('file'),attach=document.getElementById('attach'),generate=document.getElementById('generate'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),previewName=document.getElementById('previewName'),clear=document.getElementById('clear'),generated=document.getElementById('generated'),download=document.getElementById('download'),error=document.getElementById('error'),status=document.getElementById('status'),empty=document.getElementById('empty');
let selected=null;
function resizeImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return reject(new Error('画像変換失敗'));const x=new FileReader();x.onload=()=>resolve({mimeType:'image/jpeg',data:String(x.result).split(',')[1],preview:String(x.result),name:f.name});x.readAsDataURL(b)},'image/jpeg',.82)};img.onerror=()=>reject(new Error('画像を読み込めません'));img.src=String(r.result)};r.readAsDataURL(f)})}
function clearImage(){selected=null;file.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''}
attach.onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{selected=await resizeImage(f);previewImg.src=selected.preview;previewName.textContent=f.name;preview.classList.add('show')}catch(e){showError(e.message);clearImage()}};clear.onclick=clearImage;
function showError(msg){error.textContent=msg;error.classList.add('show')}function hideError(){error.classList.remove('show');error.textContent=''}
generate.onclick=async()=>{hideError();const prompt=promptEl.value.trim();if(!prompt){showError('画像の内容を入力してください');return}generate.disabled=attach.disabled=true;status.textContent='🎨 画像を生成中…';empty.style.display='none';generated.classList.remove('show');download.classList.remove('show');try{const body={prompt,aspectRatio:ratio.value,imageSize:size.value};if(selected)body.image={mimeType:selected.mimeType,data:selected.data};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=null;try{x=await r.json()}catch{}if(!r.ok||!x?.ok)throw new Error(x?.error||'画像生成に失敗しました');const mime=x.mimeType||'image/png';const src='data:'+mime+';base64,'+x.data;generated.src=src;generated.classList.add('show');download.href=src;download.classList.add('show');status.textContent='✅ 画像生成完了';}catch(e){showError(e.message);status.textContent='⚠️ 画像生成に失敗'}finally{generate.disabled=attach.disabled=false}};
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | 新規登録・ログイン</title><style>body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(440px,100%);background:#fff;border:1px solid #e2e6ee;border-radius:22px;padding:28px;box-shadow:0 20px 60px #11182718}h1{margin:0 0 8px}.sub{color:#697386;margin:0 0 24px;line-height:1.6}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:10px;border:1px solid #d9dee8;border-radius:10px;background:#f3f5f8;color:#374151;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d9dee8;border-radius:11px;font-size:15px;box-sizing:border-box;outline:none}input:focus{border-color:#111827}small{display:block;color:#8a93a3;margin-top:6px}.row{display:flex;gap:10px;margin-top:20px}button.submit{flex:1;padding:13px;border:0;border-radius:11px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.submit:disabled{opacity:.55;cursor:default}.status{min-height:44px;margin-top:15px;font-size:13px;color:#697386;line-height:1.6}.status.ok{color:#166534}.status.error{color:#b91c1c}.back{display:block;text-align:center;margin-top:18px;color:#697386;text-decoration:none;font-size:13px}.hidden{display:none}</style></head><body><main class="box"><h1>🤖 Chat AET</h1><p class="sub" id="subtitle">メールアドレスで新しいアカウントを作成できます。</p><div class="tabs"><button class="tab active" id="signupTab" type="button">新規登録</button><button class="tab" id="loginTab" type="button">ログイン</button></div><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">パスワード</label><input id="password" type="password" autocomplete="new-password" placeholder="6文字以上"><div id="confirmWrap"><label for="confirmPassword">パスワード（確認）</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="もう一度入力"><small>パスワードは6文字以上で入力してください。</small></div><div class="row"><button class="submit" id="submit" type="button">新規登録</button></div><div id="status" class="status"></div><a class="back" href="./">← Chat AETホームへ</a></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://zvcssqtcshljucbbkoac.supabase.co','sb_publishable__cgPjoZaQ5Np8EMrd_Fi1Q_6C6zzNcF');const signupEndpoint='https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-signup';const $=id=>document.getElementById(id);let mode='signup';function setStatus(text,type=''){const s=$('status');s.textContent=text;s.className='status '+type}function setMode(next){mode=next;const signup=mode==='signup';$('signupTab').classList.toggle('active',signup);$('loginTab').classList.toggle('active',!signup);$('confirmWrap').classList.toggle('hidden',!signup);$('password').autocomplete=signup?'new-password':'current-password';$('submit').textContent=signup?'新規登録':'ログイン';$('subtitle').textContent=signup?'メールアドレスで新しいアカウントを作成できます。':'登録済みのメールアドレスでChat AETにログインできます。';setStatus('')}function validate(){const email=$('email').value.trim();const password=$('password').value;const confirm=$('confirmPassword').value;if(!email)return{error:'メールアドレスを入力してください。'};if(!/^\S+@\S+\.\S+$/.test(email))return{error:'メールアドレスの形式を確認してください。'};if(password.length<6)return{error:'パスワードは6文字以上にしてください。'};if(mode==='signup'&&password!==confirm)return{error:'2つのパスワードが一致していません。'};return{email,password}}async function submit(){if($('submit').disabled)return;const v=validate();if(v.error){setStatus(v.error,'error');return}$('submit').disabled=true;try{if(mode==='signup'){setStatus('アカウントを作成しています…');const res=await fetch(signupEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v.email,password:v.password})});let result={};try{result=await res.json()}catch{}if(!res.ok)throw new Error(result.error||'登録に失敗しました');setStatus('登録完了。ログインしています…');const{error}=await supabase.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;setStatus('登録・ログインが完了しました。Chat AETへ移動します…','ok');setTimeout(()=>location.href='./chat-router.html',400)}else{setStatus('ログインしています…');const{error}=await supabase.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;setStatus('ログインしました。Chat AETへ移動します…','ok');setTimeout(()=>location.href='./chat-router.html',400)}}catch(error){const message=String(error?.message||'登録に失敗しました');const lower=message.toLowerCase();if(lower.includes('already registered')||lower.includes('user already registered')||message.includes('すでに登録'))setStatus('このメールアドレスはすでに登録されています。ログインを試してください。','error');else if(lower.includes('password'))setStatus('パスワードを確認してください。6文字以上で設定してください。','error');else setStatus(message,'error')}finally{$('submit').disabled=false}}$('signupTab').onclick=()=>setMode('signup');$('loginTab').onclick=()=>setMode('login');$('submit').onclick=submit;for(const id of ['email','password','confirmPassword'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submit()});setMode('signup');</script></body></html>

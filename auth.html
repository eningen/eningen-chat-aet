<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat AET | ログイン</title><style>body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#fff;border:1px solid #e2e6ee;border-radius:22px;padding:28px;box-shadow:0 20px 60px #11182718}h1{margin:0 0 8px}.sub{color:#697386;margin:0 0 24px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d9dee8;border-radius:11px;font-size:15px;box-sizing:border-box}.row{display:flex;gap:10px;margin-top:20px}button{flex:1;padding:13px;border:0;border-radius:11px;background:#111827;color:white;font-weight:700;cursor:pointer}.secondary{background:#eef1f6;color:#111827}.status{min-height:22px;margin-top:15px;font-size:13px;color:#697386;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#697386;text-decoration:none;font-size:13px}</style></head><body><main class="box"><h1>Chat AET</h1><p class="sub">メールアドレスでログインまたは新規登録できます。</p><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="6文字以上"><div class="row"><button onclick="signIn()">ログイン</button><button class="secondary" onclick="signUp()">新規登録</button></div><div id="status" class="status"></div><a class="back" href="./">← Chat AETホームへ</a></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://zvcssqtcshljucbbkoac.supabase.co','YOUR_SUPABASE_PUBLISHABLE_KEY');const status=document.getElementById('status');function values(){return{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}}window.signUp=async()=>{const{email,password}=values();if(!email||password.length<6){status.textContent='メールアドレスと6文字以上のパスワードを入力してください。';return}status.textContent='アカウントを作成しています…';const{error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/auth.html'}});status.textContent=error?error.message:'登録しました。確認メールが届いた場合はメール内のリンクを開いてください。';};window.signIn=async()=>{const{email,password}=values();if(!email||!password){status.textContent='メールアドレスとパスワードを入力してください。';return}status.textContent='ログインしています…';const{error}=await supabase.auth.signInWithPassword({email,password});if(error){status.textContent=error.message;return}location.href='./';};</script></body></html>

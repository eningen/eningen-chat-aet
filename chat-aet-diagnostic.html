<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat AET | 自己診断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:24px 18px}.card{background:#fff;border:1px solid #e2e6ee;border-radius:16px;padding:18px;margin:12px 0}.title{font-size:22px;font-weight:800}.sub{color:#697386;font-size:13px;margin-top:4px}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eef1f5}.row:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;background:#cbd2dd;flex:none}.ok{background:#22c55e}.ng{background:#ef4444}.warn{background:#f59e0b}.name{font-weight:700}.detail{margin-left:auto;color:#697386;font-size:12px;text-align:right}.button{border:0;border-radius:12px;background:#111827;color:#fff;padding:11px 16px;font-weight:700}.back{color:#697386;text-decoration:none;font-size:13px}
</style>
</head>
<body><main class="app">
<a class="back" href="./chat-router.html">← Chat AETへ戻る</a>
<div class="card"><div class="title">🩺 Chat AET 自己診断</div><div class="sub">公開エンドポイントの到達性を確認します。秘密鍵やサービスロールキーは取得・表示しません。</div><p><button id="run" class="button">診断を開始</button></p><div id="results"></div></div>
<div class="card"><b>⚠️ この診断で分かること</b><p style="line-height:1.7;color:#4b5563">Chat AETのフロントエンドから、Router・OpenWeather系Edge Functionへ接続できるかを確認します。SupabaseのcronやRLS、管理者専用DB状態そのものは、公開ブラウザから安全に確認できないため、このページでは秘密情報を要求しません。</p></div>
<script>
const checks=[
 {name:'Chat AET Router',url:'https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-router',body:{message:'自己診断: 接続確認だけを行い、短くOKと返してください。',history:[],memory:''}},
 {name:'OpenWeather',url:'https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-weather',body:{query:'東京の天気'}},
 {name:'OpenWeather回答',url:'https://zvcssqtcshljucbbkoac.supabase.co/functions/v1/chat-aet-weather-answer',body:{query:'東京の明日の天気'}}
];
const results=document.getElementById('results');
function row(name,state,detail){const d=document.createElement('div');d.className='row';d.innerHTML=`<span class="dot ${state}"></span><span class="name"></span><span class="detail"></span>`;d.querySelector('.name').textContent=name;d.querySelector('.detail').textContent=detail;results.appendChild(d)}
async function run(){results.innerHTML='';document.getElementById('run').disabled=true;for(const c of checks){const started=performance.now();try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c.body)});let x=null;try{x=await r.json()}catch{}const ms=Math.round(performance.now()-started);if(r.ok&&x?.ok!==false)row(c.name,'ok',`HTTP ${r.status} · ${ms}ms`);else row(c.name,'ng',`HTTP ${r.status} · ${x?.error||'応答エラー'}`)}catch(e){row(c.name,'ng',e?.message||'接続失敗')}}document.getElementById('run').disabled=false}
document.getElementById('run').onclick=run;
</script></main></body></html>
